openapi: 3.1.0
info:
  title: InstantStudy Study API
  version: 0.1.0
  description: Provider-neutral API for studying an Anki collection through any tool-capable LLM.
servers:
  - url: https://YOUR_INSTANTSTUDY_HOST
security:
  - bearerAuth: []
paths:
  /api/v1/study/prepare:
    post:
      operationId: prepareStudy
      summary: Start InstantStudy directly from pasted content or file references
      description: |
        Primary content-first entry point. Use when the learner provides material
        and wants to study immediately. Anki is optional.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contentText:
                  type: string
                  maxLength: 200000
                files:
                  type: array
                  maxItems: 10
                  items:
                    type: object
                    required: [download_url, file_id]
                    properties:
                      download_url:
                        type: string
                        format: uri
                      file_id:
                        type: string
                      mime_type:
                        type: string
                      file_name:
                        type: string
                title:
                  type: string
                goal:
                  type: string
                mode:
                  type: string
                  enum: [learn, review, quiz, test]
                  default: learn
      responses:
        "200":
          description: Study session is ready
  /api/v1/study/sessions/{sessionId}:
    get:
      operationId: getStudySession
      summary: Retrieve a prepared study session
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Prepared study session
        "404":
          description: Study session not found
  /api/v1/status:
    get:
      operationId: ankiStatus
      summary: Check Anki connectivity
      responses:
        "200":
          description: Connected Anki status
  /api/v1/decks:
    get:
      operationId: listDecks
      summary: List Anki decks
      responses:
        "200":
          description: Deck names
  /api/v1/due:
    post:
      operationId: getDueCards
      summary: Get due cards
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deckName:
                  type: string
                limit:
                  type: integer
                  minimum: 1
                  maximum: 50
                  default: 10
      responses:
        "200":
          description: Due cards
  /api/v1/search:
    post:
      operationId: searchCards
      summary: Search Anki cards
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                limit:
                  type: integer
                  minimum: 1
                  maximum: 50
                  default: 20
      responses:
        "200":
          description: Matching cards
  /api/v1/cards:
    post:
      operationId: createCard
      summary: Create a Basic Anki card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deckName, front, back]
              properties:
                deckName:
                  type: string
                front:
                  type: string
                back:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Created card
  /api/v1/reviews:
    post:
      operationId: recordReview
      summary: Record an Anki review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cardId, ease]
              properties:
                cardId:
                  type: integer
                ease:
                  type: integer
                  minimum: 1
                  maximum: 4
      responses:
        "200":
          description: Review result
  /api/v1/offer:
    post:
      operationId: getSubscriptionOffer
      summary: Resolve the active Adapty price/paywall experiment for a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId]
              properties:
                customerId:
                  type: string
                locale:
                  type: string
                  default: en
      responses:
        "200":
          description: Adapty-selected offer
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
