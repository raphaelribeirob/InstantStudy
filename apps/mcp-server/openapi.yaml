openapi: 3.1.0
info:
  title: InstantStudy Study API
  version: 0.1.0
  description: Provider-neutral API for studying an Anki collection through any tool-capable LLM.
servers:
  - url: https://YOUR_INSTANTSTUDY_HOST
security:
  - bearerAuth: []
paths:
  /api/v1/study/prepare:
    post:
      operationId: prepareStudy
      summary: Start InstantStudy directly from pasted content or file references
      description: |
        Primary content-first entry point. Use when the learner provides material
        and wants to study immediately. Anki is optional.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contentText:
                  type: string
                  maxLength: 200000
                files:
                  type: array
                  maxItems: 10
                  items:
                    type: object
                    required: [download_url, file_id]
                    properties:
                      download_url:
                        type: string
                        format: uri
                      file_id:
                        type: string
                      mime_type:
                        type: string
                      file_name:
                        type: string
                title:
                  type: string
                goal:
                  type: string
                learnerId:
                  type: string
                  description: Stable learner/profile id used to persist mastery and due reviews.
                mode:
                  type: string
                  enum: [learn, review, quiz, test]
                  default: learn
                targetMinutes:
                  type: integer
                  minimum: 1
                  maximum: 180
                maxQuestions:
                  type: integer
                  minimum: 1
                  maximum: 50
                  default: 12
                testDurationMinutes:
                  type: integer
                  minimum: 1
                  maximum: 180
                testQuestionTypes:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items:
                    type: string
                    enum: [multiple_choice, true_false, short_answer, free_recall, application]
                concepts:
                  type: array
                  maxItems: 30
                  items:
                    type: object
                    required: [label]
                    properties:
                      label:
                        type: string
                      sourceExcerpt:
                        type: string
      responses:
        "200":
          description: Study session is ready
  /api/v1/study/sessions/{sessionId}:
    get:
      operationId: getStudySession
      summary: Retrieve a prepared study session
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Prepared study session
        "404":
          description: Study session not found
  /api/v1/study/next:
    post:
      operationId: nextStudyQuestion
      summary: Get the next adaptive study target and question policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studySessionId]
              properties:
                studySessionId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Next adaptive question target
  /api/v1/study/answer:
    post:
      operationId: submitStudyAnswer
      summary: Record semantic evaluation and update mastery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studySessionId, conceptId, correctness, completeness]
              properties:
                studySessionId:
                  type: string
                  format: uuid
                conceptId:
                  type: string
                  format: uuid
                correctness:
                  type: number
                  minimum: 0
                  maximum: 1
                completeness:
                  type: number
                  minimum: 0
                  maximum: 1
                confidence:
                  type: number
                  minimum: 0
                  maximum: 1
                  default: 0.8
                missingConcepts:
                  type: array
                  items:
                    type: string
                userAnswer:
                  type: string
                feedback:
                  type: string
      responses:
        "200":
          description: Updated knowledge state and next policy
  /api/v1/study/finish:
    post:
      operationId: finishStudySession
      summary: Finish a study session and return mastery summary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studySessionId]
              properties:
                studySessionId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Session summary
  /api/v1/study/due:
    get:
      operationId: getDueReviews
      summary: Get concepts due for retrieval practice
      parameters:
        - in: query
          name: learnerId
          required: true
          schema:
            type: string
        - in: query
          name: before
          required: false
          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Due concepts ordered by review time
  /api/v1/status:
    get:
      operationId: ankiStatus
      summary: Check Anki connectivity
      responses:
        "200":
          description: Connected Anki status
  /api/v1/decks:
    get:
      operationId: listDecks
      summary: List Anki decks
      responses:
        "200":
          description: Deck names
  /api/v1/due:
    post:
      operationId: getDueCards
      summary: Get due cards
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deckName:
                  type: string
                limit:
                  type: integer
                  minimum: 1
                  maximum: 50
                  default: 10
      responses:
        "200":
          description: Due cards
  /api/v1/search:
    post:
      operationId: searchCards
      summary: Search Anki cards
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                limit:
                  type: integer
                  minimum: 1
                  maximum: 50
                  default: 20
      responses:
        "200":
          description: Matching cards
  /api/v1/cards:
    post:
      operationId: createCard
      summary: Create a Basic Anki card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deckName, front, back]
              properties:
                deckName:
                  type: string
                front:
                  type: string
                back:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Created card
  /api/v1/reviews:
    post:
      operationId: recordReview
      summary: Record an Anki review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cardId, ease]
              properties:
                cardId:
                  type: integer
                ease:
                  type: integer
                  minimum: 1
                  maximum: 4
      responses:
        "200":
          description: Review result
  /api/v1/offer:
    post:
      operationId: getSubscriptionOffer
      summary: Resolve the active Adapty price/paywall experiment for a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId]
              properties:
                customerId:
                  type: string
                locale:
                  type: string
                  default: en
      responses:
        "200":
          description: Adapty-selected offer
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
