name: Expand InstantStudy source baseline

on:
  push:
    branches:
      - feat/v0.25-core-loop
    paths:
      - .bootstrap/source.tar.xz

permissions:
  contents: write

jobs:
  expand-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and expand canonical source
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/source.tar.xz
          echo "3253b08f1696ec7f9a15fdc4092674fb0d0e8c18d08148a8e49759ad5d810bfb  .bootstrap/source.tar.xz" | sha256sum -c -
          tar -xJf .bootstrap/source.tar.xz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml

      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: import InstantStudy v0.25 core learning loop"
          git push origin HEAD:feat/v0.25-core-loop
