name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - name: Assert Neon-only storage
        run: npm run audit:database
      - name: Validate Quizlet parity inventory (not release certification)
        run: npm run audit:parity
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Production dependency audit
        run: npm run security:audit


  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: apps/flutter_app
        run: flutter pub get

      - name: Analyze Flutter client
        working-directory: apps/flutter_app
        run: flutter analyze

      - name: Test Flutter client
        working-directory: apps/flutter_app
        run: flutter test
