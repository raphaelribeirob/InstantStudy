name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/owasp-instantpay

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm run typecheck
      - name: InstantPay trust tests
        run: npm --workspace apps/pay test
      - run: npm run build
      - name: Production dependency audit
        run: npm run security:audit
