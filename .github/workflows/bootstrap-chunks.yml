name: Expand InstantStudy chunked source

on:
  push:
    branches:
      - feat/v0.25-core-loop
    paths:
      - .bootstrap/chunk_09.b64

permissions:
  contents: write

jobs:
  expand-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand verified V0.25 source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk_*.b64 > /tmp/instantstudy-v25.b64
          base64 -d /tmp/instantstudy-v25.b64 > /tmp/instantstudy-v25.tar.xz
          echo "3253b08f1696ec7f9a15fdc4092674fb0d0e8c18d08148a8e49759ad5d810bfb  /tmp/instantstudy-v25.tar.xz" | sha256sum -c -
          tar -xJf /tmp/instantstudy-v25.tar.xz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml .github/workflows/bootstrap-chunks.yml
      - name: Commit source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import InstantStudy v0.25 core learning loop"
          git push origin HEAD:feat/v0.25-core-loop
